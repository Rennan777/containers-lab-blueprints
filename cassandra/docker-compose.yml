services:
  cassandra:
    image: cassandra:5.0
    container_name: cassandra01
    hostname: cassandra01
    environment:
      TZ: America/Sao_Paulo
      CASSANDRA_CLUSTER_NAME: MyCluster
    volumes:
      - cassandra01_data:/var/lib/cassandra
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  cassandra01_data:
    name: cassandra01_data
