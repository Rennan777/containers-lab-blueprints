services:
  postgres:
    image: postgres:15
    container_name: postgres01
    hostname: postgres01
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: pgdb
    volumes:
      - postgres01_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pgdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"   # Limita o uso a 2 CPU
          memory: "2GB"  # Limita a 2GB de RAM
        reservations:
          cpus: "0.5"   # Reserva pelo menos 0.5 CPU
          memory: "512MB" # Reserva pelo menos 512MB de RAM

volumes:
  postgres01_data:
    name: postgres01_data
