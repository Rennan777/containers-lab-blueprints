services:
  mariadb:
    image: mariadb:10.6
    container_name: mariadb01
    hostname: mariadb01
    environment:
      TZ: America/Sao_Paulo
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: jasperreports
      MARIADB_USER: jasperreports
      MARIADB_PASSWORD: jasperpass
    volumes:
      - mariadb01_data:/var/lib/mysql
    restart: always

  jasperreports:
    image: p741633/jasperreports:8.2.0-jre11
    container_name: jasperreports01
    hostname: jasperreports01
    # Default app login for this image: jasperadmin / bitnami
    depends_on:
      - mariadb
    environment:
      TZ: America/Sao_Paulo
      JASPERREPORTS_DATABASE_HOST: mariadb01
      JASPERREPORTS_DATABASE_PORT_NUMBER: 3306
      JASPERREPORTS_DATABASE_USER: jasperreports
      JASPERREPORTS_DATABASE_PASSWORD: jasperpass
      JASPERREPORTS_DATABASE_NAME: jasperreports
    ports:
      - "15080:8080"
    volumes:
      - jasperreports01_data:/bitnami/jasperreports
    restart: always

volumes:
  mariadb01_data:
    name: mariadb01_data
  jasperreports01_data:
    name: jasperreports01_data
